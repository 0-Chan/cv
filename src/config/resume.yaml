summary:
  lead: |-
    복잡한 데이터를 이해하기 쉽게 표현하고,\
    안정적인 사용자 경험을 제공하는 프론트엔드 개발을 지향합니다.
  body: |
    ROS1, roslibjs 기반 모바일 로봇 검증 웹 UI 개발과 제조 현장 6곳의 협동 로봇 시스템 구축을 경험했습니다.

    이후 React 기반 B2B 데이터 대시보드와 AI 채팅 포털을 개발하며 **데이터 시각화**, **실시간 스트리밍**, 비동기 UI 구현 역량을 쌓았습니다.

experiences:
  - company: 더에스엠씨
    logo:
      src: /images/resume/the-smc.png
      alt: 더에스엠씨 로고
    role: 프론트엔드 엔지니어
    startDate: "2023-02"
    isCurrent: true
    tags:
      - 마케팅
      - 사내 시스템
    projects:
      - title: 소셜 마케팅 데이터 대시보드
        description: YouTube·Instagram 광고 성과를 통합 조회, 비교하는 B2B 데이터 분석 대시보드
        role: 데이터 시각화, UI 품질 검증, 배포 환경 구축
        issues:
          - title: 대시보드 지표 계산 방식의 복잡성
            description: 지표별 집계 기준이 달라 단순 합산이나 평균으로는 정확한 수치를 산출하기 어려웠습니다.
            approach:
              - 지표 22종을 일별 발생량, 누적값, 비율, 도달 수로 분류하고 유형별 집계 규칙 정의
              - 지표별 합산, 최종값 선택, 비율 재계산 등 클라이언트 측 집계 로직 구현
              - Recharts로 공통 차트 컴포넌트를 구성하여 숫자 형식, 축, 툴팁, 절대값·변화량 표시 방식 관리
            outcomes:
              - 신규 지표에도 표시 규칙을 일관되게 적용하여 수치 불일치 가능성을 줄이고, 공통 차트 재사용으로 중복 구현 최소화
          - title: Next.js 서비스의 CI/CD 및 무중단 배포 환경 구축
            description: >-
              Next.js 서비스의 배포 과정을 자동화하고, 신규 버전 배포 시
              서비스 중단을 최소화할 수 있는 운영 환경이 필요했습니다.
            approach:
              - 기존 Terraform 코드를 분석하고, ECS Fargate 기반 컨테이너 실행 환경을 코드로 구성
              - GitHub Actions를 활용해 Docker 이미지 빌드 → ECR 푸시 → ECS 서비스 배포까지 CI/CD 파이프라인 구축
              - ECS와 ALB를 활용한 Blue/Green 배포 방식으로 기존 서비스와 신규 버전 간 트래픽 전환 구성
            outcomes:
              - 빌드부터 배포까지 자동화해 반복적인 배포 작업 최소화
              - 기존 서비스 트래픽을 유지하면서 신규 버전을 배포할 수 있는 환경 확보
              - Terraform 기반 인프라 관리로 배포 환경의 구성 및 변경 사항을 코드로 관리
      - title: 사내 AI 채팅 포털
        description: 임직원이 사내 정보 검색 에이전트와 프론티어 AI 모델을 통합 이용할 수 있는 서비스
        role: 실시간 스트리밍 채팅 UI 개발, AWS 인프라 운영
        issues:
          - title: AI 스트리밍 응답 규격 설계 및 채팅 UI 확장
            description: >-
              외부 AI 모델과 사내 에이전트의 스트리밍 응답을 통합하고,
              사내 정보의 출처와 담당 부서를 안내하는 UI 확장이 필요했습니다.
            approach:
              - Vercel AI SDK 소스 코드를 분석해 스트리밍 이벤트 구조와 처리 흐름 파악
              - 백엔드 개발자와 협업해 사내 에이전트의 스트리밍 응답 규격을 SDK에 맞게 설계
              - SDK 기반 채팅 UI를 확장해 답변 출처 표시 및 담당 부서 연결 기능 구현
            outcomes:
              - 외부 AI 모델 3종과 사내 에이전트 4종의 스트리밍 응답을 하나의 채팅 UI로 통합
              - SDK의 공통 스트리밍 처리 구조를 활용해 모델별 중복 구현 최소화
          - title: 긴 대화의 로딩 및 렌더링 성능 최적화
            description: >-
              대화가 길어질수록 전체 메시지를 한 번에 불러와 초기 로딩이 느려지고,
              스트리밍 중 반복적인 Markdown 렌더링으로 화면 성능이 저하됐습니다.
            approach:
              - 최근 메시지를 우선 불러오고, 스크롤에 따라 이전 대화를 추가 로딩하는 Incremental Loading 적용
              - 가상 스크롤을 적용해 화면에 보이는 메시지만 렌더링
              - Markdown을 블록 단위로 메모이제이션해 스트리밍 중 변경된 블록만 재렌더링
            outcomes:
              - 긴 대화의 첫 화면 표시 시간 50% 단축
              - 스트리밍 중 렌더링 비용 70% 감소
      - title: 사내 운영 도구 개발
        description: 정산 검수, 근무 현황 대시보드를 제공하는 사내 ERP
        role: 프론트엔드 개발, 요구사항 정의 단계부터 참여
        issues:
          - title: 정산 검수 및 근무시간 취합 업무 개선
            description: >-
              정산 검수와 근무시간 취합에 반복적인 수작업이 필요했고,
              업무 내용 대비 금액의 적정성은 단순 규칙으로 판단하기 어려웠습니다.
            approach:
              - 정산 검수와 근무시간 취합 기능을 구현해 반복 업무 시스템화
              - 사전 정의된 검수 기준을 활용한 LLM 기반 정산 이상 징후 탐지 기능 연동
              - 이상 징후가 발견된 항목에 경고를 표시하는 UI 구현
            outcomes:
              - 반복적인 정산 검수 및 근무시간 취합 작업 간소화
              - 의심 항목을 우선 확인할 수 있도록 개선해 검수 효율 향상
  - company: 코가로보틱스
    logo:
      src: /images/resume/coga-robotics.png
      alt: 코가로보틱스 로고
    role: 소프트웨어 엔지니어
    startDate: "2021-01"
    endDate: "2022-06"
    isCurrent: false
    tags:
      - 3D Vision
      - 서빙 로봇
    projects:
      - title: ROS 기반 로봇 진단 및 제어 대시보드
        description: 서빙 로봇의 센서 데이터와 동작 상태를 실시간으로 확인하고, 이동을 제어하는 웹 대시보드
        role: 로봇 센서 데이터 시각화, 이동 제어 UI, 태블릿 환경 지원
        issues:
          - title: 실시간 로봇 데이터의 수신과 화면 갱신 분리
            description: 여러 ROS 토픽에서 데이터가 빠르게 들어와, 수신할 때마다 화면을 갱신하지 않으면서도 로봇의 최신 상태를 표시해야 했습니다.
            approach:
              - rosbridge와 roslibjs로 웹 클라이언트가 필요한 토픽만 구독하는 통신 계층 구성
              - 토픽별 메시지를 화면용 데이터 모델로 변환해 UI가 ROS 메시지 구조에 직접 의존하지 않도록 설계
              - 데이터의 변경 빈도와 용도에 따라 보관 방식과 화면 갱신 주기를 구분
              - 연결 상태와 마지막 수신 시각을 표시해 통신 단절과 데이터 갱신 지연을 확인할 수 있도록 구현
            outcomes:
              - 로봇의 센서와 동작 상태를 웹에서 실시간으로 확인할 수 있는 웹 진단 환경 구축
              - 통신과 화면 표시의 책임을 나눠, 새 진단 항목을 쉽게 추가하고 유지보수할 수 있는 구조 마련

