name: 이력서 검사와 Pages 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 9 1 * *"
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: npm 버전 고정
        run: npm install --global npm@12.2.0
      - name: 의존성 설치
        run: npm ci
      - name: Pages 주소 확인
        id: pages
        uses: actions/configure-pages@v5
      - name: 검사와 정적 빌드
        run: npm run verify
        env:
          SITE_URL: https://resume.0-chan.kim
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
