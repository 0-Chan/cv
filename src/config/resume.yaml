    안정적인 사용자 경험을 제공하는 프론트엔드 개발을 지향합니다.
  body: |
    ROS1, roslibjs 기반 로봇 제어 UI 개발과 제조 현장 6곳의 로봇 시스템 구축·검증을 경험했습니다.

    이후 React, Next.js 기반 B2B 데이터 대시보드와 AI 포털을 개발하며 **데이터 시각화**, **실시간 스트리밍**, 비동기 UI 구현 역량을 쌓았습니다.

experiences:
  - company: 더에스엠씨
    logo:
      src: /images/resume/the-smc.png
      alt: 더에스엠씨 로고
    role: 프론트엔드 엔지니어
    startDate: "2023-02"
    isCurrent: true
    tags:
      - 마케팅
      - Internal Product
    projects:
      - title: 소셜 마케팅 데이터 대시보드
        description: YouTube·Instagram 콘텐츠 및 광고 성과를 통합 조회하고 비교하는 B2B 데이터 분석 대시보드
        role: 데이터 시각화, UI 품질 검증, 배포 환경 구축
        issues:
          - title: 집계 방식이 다른 성과 지표의 통합 표시
            description: >-
              일별 발생값, 시점값, 비율, 중복 제거 지표(도달)는 기간을 합치는 방법이 서로 다름.
              누적 조회수를 일별 값처럼 더하거나 일별 CTR을 평균하면 실제와 다른 수치가 표시되므로,
              백엔드 집계 결과를 지표 유형에 맞게 보여 주는 화면 표시 기준 필요
            approach:
              - |-
                지표 유형별 표시 규칙 정의

                일별 발생값(광고비, 일별 조회): 막대 차트와 기간 합계

                시점값(누적 조회수, 팔로워 수): 라인 차트와 기말값, 증감

                비율(CTR, 조회율, 참여율): 별도 % 축, 기간 값은 백엔드가 재계산한 값 사용

                중복 제거 지표(도달): 기간 합계 미표시, 백엔드가 기간 단위로 집계한 값만 표시
              - YouTube와 Instagram의 같은 유형 지표에 동일한 규칙을 적용하고, 조회수처럼 플랫폼별 정의가 다른 지표는 합산하지 않고 나란히 표시
              - Recharts 기반 공통 차트 컴포넌트가 지표 유형을 받아 차트 종류, 축, 툴팁 형식을 결정하도록 설계해, 표시 규칙을 한 곳에서 관리하고 시계열·채널별 비교 화면에서 재사용
            outcomes:
              - 공통 차트 컴포넌트를 시계열 조회 화면과 채널별 조회 화면에 재사용해 지표 표시 규칙을 한 곳에서 관리
          - title: 배포 환경 구축
            description: Next.js 무중단 배포와 CI/CD를 지원하는 실행 환경을 구성 필요
            approach:
              - 기존 프로젝트의 Terraform 구성을 참고해 ECS Fargate 배포 환경 구성
              - Blue/Green 무중단 배포와 CI/CD 파이프라인 구축
            outcomes:
              - 무중단 배포가 가능한 실행 환경 마련
      - title: 사내 AI 포털 개발
        description: >-
          임직원을 위한 사내 정보 에이전트·범용 AI 채팅 포털.
          모델 3종과 사내 에이전트 4종을 한 화면에서 제공하고 직원별 외부 AI 구독 대체
        role: >-
          스트리밍 채팅 프론트엔드 개발, 이후 AWS 인프라 운영으로 담당 범위 확대
        issues:
          - title: 스트리밍 응답 처리
            description: 외부 모델과 사내 에이전트의 응답을 유형별로 처리해 채팅 화면에 실시간으로 반영해야 했습니다.
            approach:
              - 백엔드 개발자와 협의해 스트리밍 응답 이벤트 정의
              - 외부 모델과 사내 에이전트의 응답 유형별 채팅 UI 반영 로직 구현
            outcomes:
              - 스트리밍 응답을 **채팅 UI에 실시간 반영**
          - title: 긴 대화의 성능 최적화
            description: 대화가 길어질수록 모든 메시지를 한 번에 불러와 그리고, 스트리밍 중에는 답변 전체를 다시 렌더링해 화면이 느려졌습니다.
            approach:
              - 최근 메시지만 먼저 불러오고, 위로 스크롤하면 이전 메시지를 이어 불러오는 구간 단위 로딩 (Incremental Loading) 적용
              - 화면에 보이는 메시지만 그리는 가상 스크롤 적용
              - 스트리밍 중에는 마크다운을 블록 단위로 메모해 새로 생기는 블록만 렌더링
            outcomes:
              - 긴 대화의 **첫 화면 표시 시간 50% 단축**
              - 스트리밍 중 **렌더링 비용 70% 감소**
  - company: 코가로보틱스
    logo:
      src: /images/resume/coga-robotics.png
      alt: 코가로보틱스 로고
    role: 소프트웨어 엔지니어
    startDate: "2021-01"
    endDate: "2022-06"
    isCurrent: false
    tags:
      - 3D Vision
      - 서빙 로봇
    projects:
      - title: ROS 기반 로봇 진단 및 제어 대시보드
        description: 서빙 로봇의 센서 데이터와 동작 상태를 보여 주고 이동을 제어할 수 있는 웹 대시보드 개발
        role: 로봇 센서 데이터 시각화, 이동 제어 UI, 태블릿 환경 지원
        issues:
          - title: 실시간 로봇 데이터 처리
            description: 여러 ROS 토픽의 데이터가 화면 갱신보다 잦게 들어와, 불필요한 렌더링 없이 실시간으로 반영 필요
            approach:
              - rosbridge와 roslibjs로 웹 클라이언트가 필요한 토픽만 구독하는 통신 계층 구성
              - 토픽별 메시지를 화면에서 쓰는 데이터 모델로 변환해 통신 계층과 화면 컴포넌트의 의존성 분리
              - 데이터의 변경 빈도와 용도에 따라 보관 방식과 갱신 주기를 다르게 적용
              - 통신이 끊기거나 데이터가 늦을 때 마지막 수신 시각과 연결 상태를 화면에 명확히 표시
            outcomes:
              - 로봇의 센서와 동작 상태를 웹에서 실시간으로 확인할 수 있는 진단 환경 구축
              - 통신과 화면 표시의 책임을 나눠, 새 진단 항목을 쉽게 추가하고 유지보수할 수 있는 구조 마련

