      - 서빙 로봇
    projects:
      - title: ROS 기반 로봇 진단 및 제어 대시보드
        description: 서빙 로봇의 센서·동작 상태를 실시간으로 확인하고, 이동 제어와 조립 상태 점검을 지원하는 웹 대시보드
        role: 센서 데이터 시각화, 이동 제어·조립 점검 UI 개발
        issues:
          - title: 실시간 센서 데이터 처리 및 로봇 조립 상태 점검
            description: >-
              센서 데이터의 잦은 수신에 따른 화면 갱신 부담을 줄이고,
              로봇의 동작을 확인해 정상 조립 여부를 점검해야 했습니다.
            approach:
              - rosbridge·roslibjs로 ROS 토픽을 구독하고, 수신 데이터를 UI에 적합한 형태로 변환하는 로직 구현
              - 데이터 특성에 따라 화면 갱신 주기를 조절하고, 연결 상태와 마지막 수신 시각을 표시
              - ROS 제어 명령을 순차 전송해 현장 사용자가 로봇의 동작과 조립 상태를 쉽게 점검하는 직관적인 UI 구현
            outcomes:
              - 로봇의 실시간 상태 모니터링과 제어 명령을 통한 조립 상태 점검을 웹 대시보드로 통합
              - 통신 처리와 화면 표시를 분리해 진단 항목 추가 및 유지보수가 용이한 구조 마련

