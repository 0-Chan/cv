summary:
  lead: |-
    복잡한 데이터를 이해하기 쉽게 표현하고,\
    안정적인 사용자 경험을 설계하고자 노력합니다.
  body: |
    ROS1과 roslibjs 기반 서빙 로봇 진단 및 제어 웹 UI 개발을 경험했습니다.

    이후 React와 Next.js 기반 ==SNS 마케팅 데이터 대시보드==와 ==AI 챗봇 서비스==를 개발하며 **데이터 시각화**, **실시간 스트리밍**, 비동기 UI 구현 역량을 쌓았습니다.

experiences:
  - company: 더에스엠씨
    logo:
      src: /images/resume/the-smc.png
      alt: 더에스엠씨 로고
    role: 프론트엔드 개발자
    startDate: "2023-02"
    isCurrent: true
    tags:
      - 마케팅
      - 사내 시스템
    projects:
      - title: SNS 마케팅 데이터 대시보드
        description: YouTube와 Instagram 광고 성과를 통합 조회하고 비교하는 B2B 데이터 분석 대시보드
        role: 데이터 시각화, UI 품질 검증, 배포 환경 구축
        issues:
          - title: 여러 도구에 분산된 콘텐츠 성과의 통합 조회
            description: >-
              YouTube와 Instagram의 자연 유입 성과, Meta와 Google의 광고 성과가
              따로 집계되어 콘텐츠별 현황을 파악하기 어려웠습니다.
            approach:
              - 콘텐츠별 자연 유입 성과와 광고 성과를 같은 조회 기간에 함께 확인할 수 있는 통합 화면 설계
              - 다양한 조회와 비교 요구에 맞춰 차트를 구성하고 확장할 수 있도록 Recharts 기반 공통 컴포넌트 구현
            outcomes:
              - 여러 도구를 오가지 않고 콘텐츠별 자연 유입 성과와 광고 성과, 기간별 변화를 한 화면에서 확인하도록 개선
          - title: 집계 기준이 다른 지표의 표시 방식 통일
            description: >-
              일별 발생량, 누적값, 비율과 도달 수의 집계 방식이 달라,
              화면에서 각 지표의 의미와 조회 범위를 명확히 구분해야 했습니다.
            approach:
              - 백엔드가 집계한 결과를 Next.js BFF에서 화면용 공통 응답 모델로 변환
              - 플랫폼별 지표의 출처와 집계 범위를 표시하고, 정의가 다른 수치는 합산하지 않고 나란히 제공
            outcomes:
              - 지표의 출처와 집계 범위를 구분해 여러 화면에서 일관된 기준으로 조회할 수 있도록 개선
          - title: 많은 성과 데이터와 이미지로 인한 화면 로딩 및 갱신 부담
            description: >-
              다수의 성과 데이터와 콘텐츠 이미지를 표시하면서도
              첫 화면을 빠르게 제공하고, 화면 갱신 시 반복 계산을 줄여야 했습니다.
            approach:
              - RSC에서 초기 데이터를 조회하고, 데이터 대기 중에는 스켈레톤으로 화면 구조와 로딩 상태 표시
              - 차트 입력 데이터가 같으면 변환 결과를 재사용하도록 메모이제이션 적용
              - 화면 밖 콘텐츠 이미지를 지연 로딩해 초기 이미지 요청량 축소
            outcomes:
              - 초기 이미지 요청량과 화면 갱신 시 반복 계산을 줄이고, 데이터 대기 중에도 화면 구조와 로딩 상태 제공
          - title: Next.js 서비스의 CI/CD 및 무중단 배포 환경 구축
            description: >-
              Next.js 서비스의 배포 과정을 자동화하고, 신규 버전 배포 시
              서비스 중단을 최소화할 수 있는 운영 환경이 필요했습니다.
            approach:
              - 기존 Terraform 구조를 참고해 ECS Fargate 기반 서비스 인프라 구성
              - GitHub Actions로 Docker 이미지 빌드 → ECR 푸시 → ECS 서비스 배포까지 자동화
              - ECS와 ALB 기반 Blue/Green 배포와 이전 버전으로의 트래픽 복구 절차 구성
            outcomes:
              - 반복적인 배포 작업을 줄이고, 배포 이상 시 이전 버전으로 복구할 수 있는 운영 체계 확보
      - title: 사내 AI 챗봇 서비스
        description: 임직원이 사내 정보 검색 에이전트와 외부 AI 모델을 한곳에서 이용하는 채팅 서비스
        role: 실시간 스트리밍 채팅 UI 개발, AWS 인프라 운영
        issues:
          - title: 긴 대화의 로딩 및 렌더링 성능 최적화
            description: >-
              전체 대화 이력 조회로 초기 표시가 느려지고,
              스트리밍 중 반복적인 Markdown 렌더링으로 화면 반응성이 저하됐습니다.
            approach:
              - 최근 메시지를 우선 조회하고, 위로 스크롤하면 이전 메시지를 추가로 불러오도록 구성
              - Markdown 블록별 렌더링에 메모이제이션을 적용해 변경되지 않은 블록의 재렌더링 감소
            outcomes:
              - 긴 대화의 첫 화면 표시 시간 50% 단축, 스트리밍 중 React 누적 렌더링 시간 70% 감소
          - title: AI 스트리밍 응답 규격 설계 및 채팅 UI 확장
            description: >-
              외부 AI 모델과 사내 에이전트의 스트리밍 응답을 통합하고,
              사내 정보의 출처와 담당 부서를 안내하는 UI 확장이 필요했습니다.
            approach:
              - Vercel AI SDK 소스 코드를 분석하고, 백엔드와 협업해 사내 에이전트의 응답을 SDK 호환 형식으로 설계
              - SDK 기반 채팅 UI에 답변 출처 표시 및 담당 부서 연결하도록 확장
            outcomes:
              - 외부 AI 모델 3종과 사내 에이전트 4종의 스트리밍 응답을 하나의 채팅 UI로 통합
              - SDK의 공통 스트리밍 처리 구조를 활용해 모델별 중복 구현 최소화
      - title: 사내 운영 도구 개발
        description: 정산 검수, 근무 현황 대시보드를 제공하는 사내 ERP
        role: 프론트엔드 개발, 요구사항 정의 단계부터 참여
        issues:
          - title: 정산 검수 및 근무시간 취합 업무 개선
            description: >-
              반복적인 수작업을 줄이고, 업무 내용 대비 청구 금액의
              이상을 사전에 확인할 필요가 있었습니다.
            approach:
              - 정산 검수와 근무시간 취합 절차를 분석하고, 반복 작업을 줄이는 관리 UI 설계
              - 검수 기준에 따른 **LLM 기반 이상 징후 탐지 기능 연동** 및 경고 UI 표시 및 Slack 알림 발송
            outcomes:
              - 근무시간 취합 작업을 간소화하고, 정산 이상 항목을 효율적으로 선별하도록 지원
