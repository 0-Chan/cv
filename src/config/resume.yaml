summary:
  lead: |-
    복잡한 데이터를 이해하기 쉽게 표현하고,\
    안정적인 사용자 경험을 제공하는 프론트엔드 개발을 지향합니다.
  body: |
    ROS1, roslibjs 기반 모바일 로봇 검증 UI 개발과 제조 현장 6곳의 협동 로봇 시스템 구축 경험했습니다.

    이후 React, Next.js 기반 B2B 데이터 대시보드와 AI 포털을 개발하며 **데이터 시각화**, **실시간 스트리밍**, 비동기 UI 구현 역량을 쌓았습니다.

experiences:
  - company: 더에스엠씨
    logo:
      src: /images/resume/the-smc.png
      alt: 더에스엠씨 로고
    role: 프론트엔드 엔지니어
    startDate: "2023-02"
    isCurrent: true
    tags:
      - 마케팅
      - 사내 시스템
    projects:
      - title: 소셜 마케팅 데이터 대시보드
        description: YouTube·Instagram 콘텐츠 및 광고 성과를 통합 조회하고 비교하는 B2B 데이터 분석 대시보드
        role: 데이터 시각화, UI 품질 검증, 배포 환경 구축
        issues:
          - title: 지표별 집계 방식 차이로 인한 수치 오류
            description: >-
              누적 조회수는 마지막 값을 사용하고, 클릭률은 전체 기간을
              기준으로 계산하는 등 지표마다 집계 방식이 달랐습니다.
              단순 합산이나 평균으로 처리하면 잘못된 수치가 표시됐습니다.
            approach:
              - 지표 22종을 일별 발생량, 누적값, 비율, 도달 수로 분류하고 유형별 집계 규칙 정의
              - 지표별 합산, 최종값 선택, 비율 재계산 등 집계 로직 구현
              - 공통 차트 컴포넌트에서 숫자 형식, 축, 툴팁, 절대값·변화량 표시 방식 관리
              - 플랫폼마다 정의가 다른 지표는 합산하지 않고 나란히 표시
            outcomes:
              - 공통 차트를 3개 화면에 재사용해 지표 표시 방식 통일 및 수치 불일치 방지
              - 새로운 지표 추가 시 유형별 집계·표시 규칙을 재사용해 중복 구현 최소화
          - title: 배포 환경 구축
            description: Next.js 무중단 배포와 CI/CD를 지원하는 실행 환경을 구성 필요
            approach:
              - 기존 프로젝트의 Terraform 구성을 참고해 ECS Fargate 배포 환경 구성
              - Blue/Green 무중단 배포와 CI/CD 파이프라인 구축
            outcomes:
              - 무중단 배포가 가능한 실행 환경 마련
      - title: 사내 AI 포털 개발
        description: >-
          임직원을 위한 사내 정보 에이전트·범용 AI 채팅 포털.
          모델 3종과 사내 에이전트 4종을 한 화면에서 제공하고 직원별 외부 AI 구독 대체
        role: >-
          스트리밍 채팅 프론트엔드 개발, 이후 AWS 인프라 운영으로 담당 범위 확대
        issues:
          - title: 스트리밍 응답 처리
            description: 외부 모델과 사내 에이전트의 응답을 유형별로 처리해 채팅 화면에 실시간으로 반영해야 했습니다.
            approach:
              - 백엔드 개발자와 협의해 스트리밍 응답 이벤트 정의
              - 외부 모델과 사내 에이전트의 응답 유형별 채팅 UI 반영 로직 구현
            outcomes:
              - 스트리밍 응답을 **채팅 UI에 실시간 반영**
          - title: 긴 대화의 성능 최적화
            description: 대화가 길어질수록 모든 메시지를 한 번에 불러와 그리고, 스트리밍 중에는 답변 전체를 다시 렌더링해 화면이 느려졌습니다.
            approach:
              - 최근 메시지만 먼저 불러오고, 위로 스크롤하면 이전 메시지를 이어 불러오는 구간 단위 로딩 (Incremental Loading) 적용
              - 화면에 보이는 메시지만 그리는 가상 스크롤 적용
              - 스트리밍 중에는 마크다운을 블록 단위로 메모해 새로 생기는 블록만 렌더링
            outcomes:
              - 긴 대화의 **첫 화면 표시 시간 50% 단축**
              - 스트리밍 중 **렌더링 비용 70% 감소**
      - title: 사내 운영 도구 개발
        description: 정산 검수, 근무 현황 대시보드를 제공하는 사내 ERP
        role: 프론트엔드 개발, 요구사항 정의 단계부터 참여
        issues:
          - title: 정산 검수와 근무시간 취합 자동화
            description: 정산 검수와 근무시간 취합에 수작업이 반복되고, 비고와 금액은 규칙만으로 대조하기 어려움
            approach:
              - 정산 검수와 근무시간 취합을 시스템화하고, 비고와 금액을 비교하는 **LLM 검수 보조 기능** 연동
            outcomes:
              - 불일치 항목을 화면에 표시해 수작업을 줄이고 **업무 효율 개선**
  - company: 코가로보틱스
    logo:
      src: /images/resume/coga-robotics.png
