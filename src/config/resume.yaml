experiences:
  - company: 더에스엠씨
    logo:
      src: /images/resume/the-smc.png
      alt: 더에스엠씨 로고
    role: 프론트엔드 엔지니어
    startDate: "2023-02"
    isCurrent: true
    tags:
      - 마케팅
      - Internal Product
    projects:
      - title: 소셜 마케팅 데이터 대시보드
        description: YouTube·Instagram 콘텐츠 및 광고 성과를 통합 조회하고 비교하는 B2B 데이터 분석 대시보드
        technologies:
          - React
          - Recharts
          - Storybook
          - AWS ECS Fargate
          - Terraform
        role: 데이터 시각화, UI 품질 검증, 배포 환경 구축
        issues:
          - title: 다양한 데이터 구조의 통합 시각화
            description: >-
              서로 다른 SNS 채널의 성과 지표를 통합 조회해야 하며,
              지표별 데이터 구조와 표현 방식이 달라 화면 개발 및 유지보수 복잡성이 증가할 수 있었습니다.
            approach:
              - API 응답 모델과 차트 렌더링 모델을 분리하여 채널별 데이터 변환 로직을 독립적으로 구성
              - Recharts 기반 공통 차트 컴포넌트를 설계하여 시계열 데이터와 채널별 비교 지표를 재사용 가능하게 구성
              - 광고 성과와 자연 발생 성과를 구분하는 데이터 표현 규칙을 정의하여 지표 해석의 일관성 확보
              - 차트 데이터 변환 비용을 측정하고 필요시 메모이제이션을 적용하여 반복 계산 최소화
              - 로딩·오류·데이터 없음 상태를 명시적으로 구분하여 분석 화면의 안정성과 사용성 개선
            outcomes:
              - YouTube·Instagram의 주요 성과 지표를 한 화면에서 조회하고 비교하는 환경 제공
              - 지표 및 차트 컴포넌트의 재사용성을 확보하여 신규 분석 기능 개발에 대응 가능한 구조 마련
          - title: UI 변경 검증
            description: UI 변경으로 발생하는 픽셀 단위 불일치를 CI/CD 단계에서 조기에 확인해야 했습니다.
            approach:
              - Storybook 기반 시각 회귀 테스트 구축
            outcomes:
              - CI/CD 단계에서 픽셀 단위 UI 불일치를 조기에 확인
          - title: 배포 환경 구축
            description: 무중단 배포와 CI/CD를 지원하는 실행 환경을 구성해야 했습니다.
            approach:
              - 기존 프로젝트의 Terraform 구성을 참고해 ECS Fargate 배포 환경 구성
              - Blue/Green 무중단 배포와 CI/CD 파이프라인 구축
            outcomes:
              - 무중단 배포가 가능한 실행 환경 마련
      - title: 사내 AI 포털 개발
        description: 임직원 약 500명을 위한 AI 채팅·에이전트·FAQ 관리 포털
        technologies:
          - Next.js
          - AWS
        role: >-
          스트리밍 채팅 프론트엔드 개발, 이후 운영 어드민 개발 및 AWS 인프라 운영으로 담당 범위 확대
        issues:
          - title: AI 이용 환경 통합
            description: 직원별 외부 AI 구독을 대체할 공용 이용 환경이 필요했습니다.
            approach:
              - 모델 3종과 사내 에이전트 4종을 한 화면에서 제공
            outcomes:
              - 직원별 외부 AI 구독을 공용 포털로 대체
          - title: 스트리밍 응답 처리
            description: 외부 모델과 사내 에이전트의 응답을 유형별로 처리해 채팅 화면에 실시간으로 반영해야 했습니다.
            approach:
              - 백엔드 개발자와 협의해 스트리밍 응답 이벤트 정의
              - 외부 모델과 사내 에이전트의 응답 유형별 채팅 UI 반영 로직 구현
            outcomes:
              - 스트리밍 응답을 **채팅 UI에 실시간 반영**
          - title: 부서별 에이전트·FAQ 운영
            description: 사내 규정 문의에 대응하면서 각 부서가 에이전트와 FAQ를 직접 관리할 환경이 필요했습니다.
            approach:
              - 문서 출처가 포함된 에이전트 답변 제공
              - 부서별 에이전트와 FAQ를 관리할 수 있는 운영 어드민 구축
            outcomes:
              - 개발자 지원 없이 각 부서가 자체 에이전트와 FAQ 관리
          - title: 운영 비용 최적화
            description: 서비스 운영에 필요한 AWS 인프라와 배포 파이프라인을 관리하고 운영 비용을 최적화해야 했습니다.
            approach:
              - AWS 인프라와 CI/CD 파이프라인 운영
              - CDN 전환과 컴퓨팅 리소스 최적화
            outcomes:
              - 운영 비용 절감
