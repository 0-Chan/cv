        role: ==센서 데이터 시각화==, 제어 및 점검 UI 개발
        issues:
          - title: 실시간 센서 데이터 처리 및 로봇 동작 점검
            description: >-
              잦은 센서 데이터 수신에 따른 화면 갱신 부담을 줄이고,
              조립 후 로봇의 정상 동작 여부를 확인할 수 있어야 했습니다.
            approach:
              - rosbridge와 roslibjs 기반 ROS 토픽 구독과 데이터 변환 로직을 UI에서 분리
              - 데이터 특성에 따라 화면 갱신 주기를 조절하고, 연결 상태와 데이터 수신 시각을 표시
              - ROS 제어 명령을 순차 전송하여 동작을 점검하는 UI 구현
            outcomes:
              - 현장 작업자가 로봇 상태 확인과 동작 점검을 웹 대시보드에서 수행하도록 개선
              - 통신 처리와 화면 표시 로직을 분리해 진단 항목 추가 및 변경이 용이한 구조 마련

