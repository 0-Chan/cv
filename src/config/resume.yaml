  body: |
    ROS1, roslibjs 기반 로봇 제어 UI 개발과 제조 현장 6곳의 로봇 시스템 구축·검증을 경험했습니다.

    이후 React, Next.js 기반 B2B 데이터 대시보드와 AI 포털을 개발하며 **데이터 시각화**, **실시간 스트리밍**, 비동기 UI 구현 역량을 쌓았습니다.

experiences:
  - company: 더에스엠씨
    logo:
      src: /images/resume/the-smc.png
      alt: 더에스엠씨 로고
    role: 프론트엔드 엔지니어
    startDate: "2023-02"
    isCurrent: true
    tags:
      - 마케팅
      - Internal Product
    projects:
      - title: 소셜 마케팅 데이터 대시보드
        description: YouTube·Instagram 콘텐츠 및 광고 성과를 통합 조회하고 비교하는 B2B 데이터 분석 대시보드
        technologies:
          - React
          - Recharts
          - Storybook
          - AWS ECS Fargate
          - Terraform
        role: 데이터 시각화, UI 품질 검증, 배포 환경 구축
        issues:
          - title: 다양한 데이터 구조의 통합 시각화
            description: >-
              지표별 데이터 구조가 다른 SNS 성과 데이터를 한 화면에 통합해 보여줘야 했습니다.
            approach:
              - API 응답 모델과 차트 렌더링 모델을 분리하여 채널별 데이터 변환 로직을 독립적으로 구성
              - Recharts 기반 공통 차트 컴포넌트를 설계하여 시계열 데이터와 채널별 비교 지표를 재사용 가능하게 구성
              - 광고 성과와 자연 발생 성과를 구분하는 데이터 표현 규칙을 정의하여 지표 해석의 일관성 확보
              - 차트 데이터 변환 비용을 측정하고 필요시 메모이제이션을 적용하여 반복 계산 최소화
            outcomes:
              - YouTube·Instagram의 주요 성과 지표를 한 화면에서 조회하고 비교하는 환경 제공
          - title: 배포 환경 구축
            description: 무중단 배포와 CI/CD를 지원하는 실행 환경을 구성해야 했습니다.
            approach:
              - 기존 프로젝트의 Terraform 구성을 참고해 ECS Fargate 배포 환경 구성
              - Blue/Green 무중단 배포와 CI/CD 파이프라인 구축
            outcomes:
              - 무중단 배포가 가능한 실행 환경 마련
      - title: 사내 AI 포털 개발
        description: >-
          임직원 약 500명을 위한 공용 AI 채팅·에이전트·FAQ 관리 포털.
          모델 3종과 사내 에이전트 4종을 한 화면에서 제공하고 직원별 외부 AI 구독 대체
        technologies:
          - Next.js
          - AWS
        role: >-
          스트리밍 채팅 프론트엔드 개발, 이후 운영 어드민 개발 및 AWS 인프라 운영으로 담당 범위 확대
        issues:
          - title: 스트리밍 응답 처리
            description: 외부 모델과 사내 에이전트의 응답을 유형별로 처리해 채팅 화면에 실시간으로 반영해야 했습니다.
            approach:
              - 백엔드 개발자와 협의해 스트리밍 응답 이벤트 정의
              - 외부 모델과 사내 에이전트의 응답 유형별 채팅 UI 반영 로직 구현
            outcomes:
              - 스트리밍 응답을 **채팅 UI에 실시간 반영**
          - title: 부서별 에이전트·FAQ 운영
            description: 사내 규정 문의에 대응하면서 각 부서가 에이전트와 FAQ를 직접 관리할 환경이 필요했습니다.
            approach:
              - 문서 출처가 포함된 에이전트 답변 제공
              - 부서별 에이전트와 FAQ를 관리할 수 있는 운영 어드민 구축
            outcomes:
              - 개발자 지원 없이 각 부서가 자체 에이전트와 FAQ 관리
  - company: 코가로보틱스
    logo:
      src: /images/resume/coga-robotics.png
      alt: 코가로보틱스 로고
    role: 소프트웨어 엔지니어
    startDate: "2021-01"
    endDate: "2022-06"
    isCurrent: false
    tags:
      - 3D Vision
      - 서빙 로봇
    projects:
      - title: ROS 기반 로봇 진단 및 제어 대시보드
        description: ROS 기반 서빙 로봇의 센서 데이터, 동작 상태, 이동 제어 기능을 제공하는 웹 대시보드 개발
        technologies:
          - ROS1
          - roslibjs
          - JavaScript
          - PWA
        role: 로봇 센서 데이터 시각화, 이동 제어 UI, 태블릿 환경 지원
        issues:
          - title: 실시간 로봇 데이터 처리
            description: >-
              다양한 ROS Topic에서 전달되는 센서 데이터와 로봇 상태 정보를 하나의 웹 대시보드에 표현해야 했으며, 데이터 수신 주기와 화면 갱신
              주기의 차이를 고려할 필요가 있었습니다.
            approach:
              - ROS Bridge와 roslibjs를 활용하여 웹 클라이언트에서 필요한 Topic을 구독하는 통신 계층 구성
              - Topic별 메시지 구조를 UI에서 사용할 데이터 모델로 변환하여 통신 계층과 화면 컴포넌트의 의존성 분리
              - 센서 데이터의 변경 빈도와 중요도에 따라 상태 관리 및 렌더링 전략 차등 적용
              - 최신 데이터만 필요한 항목과 이력 보관이 필요한 항목을 구분하여 메모리 사용량과 화면 갱신 비용 관리
              - 통신 연결이 끊어지거나 데이터가 지연될 때 마지막 수신 시각과 연결 상태를 사용자에게 명확히 표현
            outcomes:
              - 로봇의 센서 및 동작 상태를 웹에서 확인할 수 있는 실시간 진단 환경 구축
              - 통신과 화면 표시의 책임을 분리하여 신규 진단 항목 추가와 유지보수에 대응하기 쉬운 구조 마련

skills:
  프론트엔드:
    - >-
      **JavaScript:** 스코프와 클로저, 이벤트 루프의 동작 원리를 이해하고 비동기 처리와 이벤트 로직을 구현합니다.
    - >-
      **TypeScript:** 컴포넌트와 API에서 사용하는 데이터 구조를 타입으로 정의하고 관리할 수 있습니다.
    - >-
      **React:** 화면의 역할과 데이터 흐름을 기준으로 컴포넌트를 나누고, 공통 UI를 재사용하는 방식으로 개발합니다.
    - >-
      **Next.js:** 페이지와 컴포넌트를 구성하고, API 연동과 기능 개발·유지보수를 수행합니다.
  테스트·협업:
    - >-
      **Git:** 브랜치와 PR로 협업하고, 코드 리뷰를 통해 변경 내용과 의도를 공유합니다.
    - >-
      **Vitest:** 입력과 기대 결과를 기준으로 함수와 로직의 동작을 검증하는 테스트를 작성합니다.
    - >-
      **Testing Library:** 사용자 조작과 화면에 나타나는 결과를 기준으로 컴포넌트를 테스트할 수 있습니다.
  인프라·배포:
    - >-
      **AWS:** 서비스의 배포 안정성과 운영 비용을 고려해 리소스와 설정을 조정할 수 있습니다.
    - >-
      **Terraform:** 코드로 관리되는 인프라 구성을 파악하고, 운영에 필요한 설정 변경을 반영할 수 있습니다.
    - >-
      **GitHub Actions:** 빌드·배포 과정을 워크플로로 구성하고, 반복 작업을 자동화할 수 있습니다.

